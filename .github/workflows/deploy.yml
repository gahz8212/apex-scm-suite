name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ----------------------------------------------------
  # 1. CI: 코드 유효성 검사 (TypeScript, 빌드, 백엔드 문법)
  # ----------------------------------------------------
  ci:
    name: CI (Build & Syntax Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Build Frontend
        run: npm run build
        env:
          CI: false

      - name: Backend Syntax & Dependency Check
        run: |
          cd backend
          npm ci
          node -c index.js
          node -c routes/*.js

  # ----------------------------------------------------
  # 2. CD: Docker 이미지 빌드 및 서버 자동 배포 (main 브랜치만)
  # ----------------------------------------------------
  deploy:
    name: CD (Docker Build & SSH Deploy)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Convert Repository Name to Lowercase
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          echo "BE_IMAGE=ghcr.io/${REPO_LOWER}/backend:latest" >> $GITHUB_ENV
          echo "FE_IMAGE=ghcr.io/${REPO_LOWER}/frontend:latest" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 백엔드 Docker 이미지 빌드 & GHCR 푸시
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.BE_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 프론트엔드 Docker 이미지 빌드 & GHCR 푸시
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ env.FE_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # docker-compose.prod.yml 파일을 서버로 복사
      - name: Copy Compose File to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: "~/apex-scm-suite"

      # 배포 서버에 접속하여 최신 이미지 pull 및 재시작
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            mkdir -p ~/apex-scm-suite
            cd ~/apex-scm-suite
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            BACKEND_IMAGE="${{ env.BE_IMAGE }}" FRONTEND_IMAGE="${{ env.FE_IMAGE }}" docker compose -f docker-compose.prod.yml pull
            BACKEND_IMAGE="${{ env.BE_IMAGE }}" FRONTEND_IMAGE="${{ env.FE_IMAGE }}" HTTP_PORT=8080 docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
            docker image prune -af --filter "until=72h"
            docker compose -f docker-compose.prod.yml ps

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: apex_scm_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: auth-toolkit
    ports:
      - "3306:3306"
    volumes:
      - apex_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password

volumes:
  apex_mysql_data:
